name: Release (master)
permissions: write-all
on:
  pull_request:
    types:
      - closed
    branches:
      - master
jobs:
  build-docs:
    if: github.event.pull_request.merged == true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/workflows/actions/docs
        with:
          os: ${{ matrix.os }}
  run-tests-cpp:
    if: github.event.pull_request.merged == true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/workflows/actions/setup
        with:
          os: ${{ matrix.os }}
      - uses: ./.github/workflows/actions/compile
      - name: Test the library
        run: make test
  run-tests-python:
    if: github.event.pull_request.merged == true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13"]
        install-type: ["src", "tarball"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/workflows/actions/setup
        with:
          os: ${{ matrix.os }}
      - name: Set up Python and its dependencies ${{ matrix.python-version }}
        uses: ./.github/workflows/actions/setup-python
        with:
          os: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}
      - name: Write the released version to VERSION file
        shell: bash
        run: |
          echo "v0.0.0-dev.1" > VERSION
          echo "v0.0.0-dev.1" > bindings/python/VERSION
      - name: Compile the Python bindings from the source
        uses: ./.github/workflows/actions/compile-python-src
      - name: Compile the Python bindings from the tarball
        if: matrix.install-type == 'tarball'
        uses: ./.github/workflows/actions/compile-python-tarball
      - name: Test the Python bindings
        uses: ./.github/workflows/actions/test-python
  release:
    needs: [build-docs, run-tests-cpp, run-tests-python]
    runs-on: ubuntu-latest
    outputs:
      new-tag: ${{ steps.bump.outputs.new-tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/workflows/actions/github-actions-git-config
      - uses: ./.github/workflows/actions/bump-version
        id: bump
  sync-devel-with-master:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/workflows/actions/github-actions-git-config
      - name: Create sync branch
        id: sync-branch
        run: |
          git checkout -B sync/master-into-devel origin/devel
          if git merge origin/master --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "Merge conflicts detected — committing with conflict markers for manual resolution in the PR."
            git add -A
            git commit -m "chore: Merge 'master' into 'devel' (CONFLICTS — needs manual resolution)"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi
          git push origin sync/master-into-devel --force
      # - name: Merge master into devel
      #     run: |
      #       git checkout -B devel origin/devel
      #       git merge origin/master --no-edit
      #       git push origin devel
      - name: Create or update sync PR
        env:
          # GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          CONFLICT: ${{ steps.sync-branch.outputs.conflict }}
        run: |
          PR_NUMBER=$(gh pr list \
            --head sync/master-into-devel \
            --base devel \
            --json number \
            --jq '.[0].number')

          if [ "$CONFLICT" = "true" ]; then
            TITLE="chore: Sync 'master' into 'devel' (CONFLICTS — manual resolution needed)"
            BODY="Automated sync of 'master' into 'devel' after release. This branch has merge conflicts (committed with conflict markers) — resolve them manually in this PR before merging."
          else
            TITLE="chore: Sync 'master' into 'devel'"
            BODY="Automated sync of 'master' into 'devel' after release. Auto-merged when all checks pass."
          fi

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --head sync/master-into-devel \
              --base devel \
              --title "$TITLE" \
              --body "$BODY" \
              --label automated/sync
          else
            echo "PR #$PR_NUMBER already exists, updated branch."
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY"
          fi
      - name: Enable auto-merge on sync PR
        if: steps.sync-branch.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          PR_NUMBER=$(gh pr list \
            --head sync/master-into-devel \
            --base devel \
            --json number \
            --jq '.[0].number')
          gh pr merge "$PR_NUMBER" --auto --merge
  deploy-website:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/website.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      version: master
  build-pypi-sdist:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/workflows/actions/setup
        with:
          os: ubuntu-latest
      - name: Set up Python and its dependencies
        uses: ./.github/workflows/actions/setup-python
        with:
          os: ubuntu-latest
          python-version: "3.13"
          version: ${{ needs.release.outputs.new-tag }}
      # Also installs the sdist, so an sdist that does not build stops the release before anything is published.
      - name: Build the sdist
        uses: ./.github/workflows/actions/compile-python-tarball
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error
  # cibuildwheel builds only for the platform it runs on, so every OS/architecture pair gets its own native runner.
  #  The wheels are built from the sdist of this release, the same sources a `pip install` without a wheel builds.
  build-pypi-wheels:
    needs: build-pypi-sdist
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        # macOS 15 is the oldest macOS release with both an arm64 and an x86_64 runner; see the deployment target below.
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      # Only for the local setup action: the wheels build from the sdist artifact.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: pypi-sdist
          path: sdist
      # Builds against Homebrew's LLVM like every other macOS job; the setup action keys its macOS steps on this label.
      - if: runner.os == 'macOS'
        uses: ./.github/workflows/actions/setup
        with:
          os: macos-latest
      # delocate bundles Homebrew's libc++, which is built for the runner's macOS, into the wheel, so the wheel cannot
      #  claim an older macOS than the runner's.
      - name: Target the macOS release of the runner
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d. -f1).0" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build the wheels
        run: |
          python3 -m pip install "cibuildwheel>=3.1,<4"
          python3 -m cibuildwheel --output-dir wheelhouse sdist/*.tar.gz
        env:
          CIBW_BUILD: "cp313-* cp314-*"
          # The musllinux (Alpine) images are not validated; the manylinux images all carry yum.
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BEFORE_ALL_LINUX: "yum install -y cmake make gcc-c++"
          # No extras: the wheel must import without any optional dependency.
          CIBW_TEST_COMMAND: python -c "import libmata.nfa.nfa as nfa; nfa.Nfa(1)"
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-wheels-${{ matrix.runner }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  # Publishes the sdist and all wheels at once, and only after every one of them has been built.
  deploy-pypi:
    needs: [build-pypi-sdist, build-pypi-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true
      - uses: ./.github/workflows/actions/deploy-pypi
        with:
          dist-dir: dist
          pypi-token: ${{ secrets.PYPI_SECRET_TOKEN }}
