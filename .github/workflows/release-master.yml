name: Release (master)
permissions: write-all
on:
  pull_request:
    types:
      - closed
    branches:
      - master
jobs:
  build-docs:
    if: github.event.pull_request.merged == true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/workflows/actions/docs
        with:
          os: ${{ matrix.os }}
  run-tests-cpp:
    if: github.event.pull_request.merged == true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/workflows/actions/setup
        with:
          os: ${{ matrix.os }}
      - uses: ./.github/workflows/actions/compile
        with:
          build-log-output-file: "warnings-new"
      - name: Test the library
        run: make test
  run-tests-python:
    if: github.event.pull_request.merged == true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13"]
        install-type: ["src", "tarball"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/workflows/actions/setup
        with:
          os: ${{ matrix.os }}
      - name: Set up Python and its dependencies ${{ inputs.python-version }}
        uses: ./.github/workflows/actions/setup-python
        with:
          os: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}
      - name: Write the released version to VERSION file
        shell: bash
        run: |
          echo "v0.0.0-dev.1" > VERSION
          echo "v0.0.0-dev.1" > bindings/python/VERSION
      - name: Compile the Python bindings from the source
        uses: ./.github/workflows/actions/compile-python-src
      - name: Compile the Python bindings from the tarball
        if: matrix.install-type == 'tarball'
        uses: ./.github/workflows/actions/compile-python-tarball
      - name: Test the Python bindings
        uses: ./.github/workflows/actions/test-python
  release:
    needs: [build-docs, run-tests-cpp, run-tests-python]
    runs-on: ubuntu-latest
    outputs:
      new-tag: ${{ steps.bump.outputs.new-tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/workflows/actions/github-actions-git-config
      - uses: ./.github/workflows/actions/bump-version
        id: bump
  sync-devel-with-master:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/workflows/actions/github-actions-git-config
      - name: Create sync branch
        id: sync-branch
        run: |
          git checkout -B sync/master-into-devel origin/devel
          if git merge origin/master --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "Merge conflicts detected — committing with conflict markers for manual resolution in the PR."
            git add -A
            git commit -m "chore: Merge 'master' into 'devel' (CONFLICTS — needs manual resolution)"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi
          git push origin sync/master-into-devel --force
      # - name: Merge master into devel
      #     run: |
      #       git checkout -B devel origin/devel
      #       git merge origin/master --no-edit
      #       git push origin devel
      - name: Create or update sync PR
        env:
          # GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          CONFLICT: ${{ steps.sync-branch.outputs.conflict }}
        run: |
          PR_NUMBER=$(gh pr list \
            --head sync/master-into-devel \
            --base devel \
            --json number \
            --jq '.[0].number')

          if [ "$CONFLICT" = "true" ]; then
            TITLE="chore: Sync 'master' into 'devel' (CONFLICTS — manual resolution needed)"
            BODY="Automated sync of 'master' into 'devel' after release. This branch has merge conflicts (committed with conflict markers) — resolve them manually in this PR before merging."
          else
            TITLE="chore: Sync 'master' into 'devel'"
            BODY="Automated sync of 'master' into 'devel' after release. Auto-merged when all checks pass."
          fi

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --head sync/master-into-devel \
              --base devel \
              --title "$TITLE" \
              --body "$BODY" \
              --label automated/sync
          else
            echo "PR #$PR_NUMBER already exists, updated branch."
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY"
          fi
      - name: Enable auto-merge on sync PR
        if: steps.sync-branch.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          PR_NUMBER=$(gh pr list \
            --head sync/master-into-devel \
            --base devel \
            --json number \
            --jq '.[0].number')
          gh pr merge "$PR_NUMBER" --auto --merge
  deploy-docs:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/workflows/actions/docs
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/_build/html
  deploy-pypi:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: ./.github/workflows/actions/deploy-pypi
        with:
          os: ${{ runner.os }}
          python-version: ${{ matrix.python-version }}
          version: ${{ needs.release.outputs.new-tag }}
          pypi-token: ${{ secrets.PYPI_SECRET_TOKEN }}
