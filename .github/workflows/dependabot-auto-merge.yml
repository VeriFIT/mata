name: Dependabot auto-merge
on: pull_request
# Dependabot pull requests get a read-only token unless the workflow asks for more.
permissions:
  contents: write
  pull-requests: write
jobs:
  enable-auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # The required checks gate the merge. Updates of the actions are left to a maintainer, as the release workflows
      #  using them only run after a merge.
      - name: Enable auto-merge for lock file updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr diff "$PR_URL" --name-only | grep --quiet '^\.github/'; then
              echo "The pull request changes .github/; leaving the merge to a maintainer."
          else
              gh pr merge "$PR_URL" --auto --merge
          fi
