name: Setup environment
description: Setup environment for running workflows.
inputs:
  os:
    description: "Operating system to run on"
    required: false
    default: ubuntu-latest
runs:
  using: "composite"
  steps:
    - name: Building MacOS dependencies
      if: ${{ inputs.os == 'macos-latest' }}
      shell: sh
      run: brew install lcov gcovr automake
    - name: Building Unix dependencies
      if: ${{ inputs.os == 'ubuntu-latest' }}
      shell: sh
      run: sudo apt install -y build-essential lcov gcovr xdg-utils
    # Mata uses C++23, which needs GCC >= 14 or Clang >= 18.
    # The Ubuntu 24.04 runner image ships GCC 12/13/14, but *defaults* to 13.
    - name: Select a C++23-capable compiler (Linux)
      if: ${{ inputs.os == 'ubuntu-latest' }}
      shell: sh
      run: |
        command -v g++-14 >/dev/null || sudo apt install -y g++-14 gcc-14
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"
        g++-14 --version
    # AppleClang version numbers do not track upstream LLVM, and the Xcode shipped on macos-latest is not new
    #  enough. Homebrew's own "llvm" formula looked like an alternative, but its bundled libc++ does not ship
    #  the <generator> header we need at all (confirmed: no file matching it under its include/c++/v1), no
    #  matter which flags point at it. Use Homebrew's GCC instead, matching the Linux job's approach, since
    #  GCC's libstdc++ has shipped <generator> since GCC 14.
    - name: Select a C++23-capable compiler (macOS)
      if: ${{ inputs.os == 'macos-latest' }}
      shell: sh
      run: |
        brew install gcc
        GCC_PREFIX="$(brew --prefix gcc)"
        # Restrict to gcc-<N>/g++-<N>: the keg also ships helper binaries such as gcc-ar-<N>,
        #  gcc-nm-<N> and gcc-ranlib-<N> that a looser glob (e.g. gcc-*) would also match.
        GXX="$(ls "$GCC_PREFIX"/bin/g++-[0-9]* | sort -V | tail -n 1)"
        GCC_BIN="$(ls "$GCC_PREFIX"/bin/gcc-[0-9]* | sort -V | tail -n 1)"
        echo "CC=$GCC_BIN" >> "$GITHUB_ENV"
        echo "CXX=$GXX" >> "$GITHUB_ENV"
        "$GXX" --version
