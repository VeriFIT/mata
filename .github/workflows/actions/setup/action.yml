name: Setup environment
description: Setup environment for running workflows.
inputs:
  os:
    description: "Operating system to run on"
    required: false
    default: ubuntu-latest
  compiler:
    description: "Compiler family to build with (gcc or clang). Linux only: macOS always uses Homebrew LLVM Clang."
    required: false
    default: gcc
runs:
  using: "composite"
  steps:
    - name: Building MacOS dependencies
      if: ${{ inputs.os == 'macos-latest' }}
      shell: sh
      run: brew install lcov gcovr automake
    - name: Building Unix dependencies
      if: ${{ inputs.os == 'ubuntu-latest' }}
      shell: sh
      run: sudo apt install -y build-essential lcov gcovr xdg-utils
    # Mata uses C++23. The distro's default gcc/g++ (unversioned) can lag behind, so pick the
    #  newest versioned gcc-<N>/g++-<N> package available in apt instead of hardcoding a version.
    - name: Select GCC (Linux)
      if: ${{ inputs.os == 'ubuntu-latest' && inputs.compiler == 'gcc' }}
      shell: sh
      run: |
        sudo apt update
        GCC_VER="$(apt-cache search --names-only '^gcc-[0-9]+$' | awk '{print $1}' | sed 's/^gcc-//' | sort -n | tail -n 1)"
        sudo apt install -y "gcc-$GCC_VER" "g++-$GCC_VER"
        echo "CC=gcc-$GCC_VER" >> "$GITHUB_ENV"
        echo "CXX=g++-$GCC_VER" >> "$GITHUB_ENV"
        "g++-$GCC_VER" --version
    # Also installs the latest g++ so its libstdc++ is on disk: Clang links against the newest GCC's
    #  libstdc++ it can find, which is what actually ships recent C++23 library additions such as <generator>.
    - name: Select Clang (Linux)
      if: ${{ inputs.os == 'ubuntu-latest' && inputs.compiler == 'clang' }}
      shell: sh
      run: |
        sudo apt update
        CLANG_VER="$(apt-cache search --names-only '^clang-[0-9]+$' | awk '{print $1}' | sed 's/^clang-//' | sort -n | tail -n 1)"
        GCC_VER="$(apt-cache search --names-only '^gcc-[0-9]+$' | awk '{print $1}' | sed 's/^gcc-//' | sort -n | tail -n 1)"
        sudo apt install -y "clang-$CLANG_VER" "g++-$GCC_VER"
        echo "CC=clang-$CLANG_VER" >> "$GITHUB_ENV"
        echo "CXX=clang++-$CLANG_VER" >> "$GITHUB_ENV"
        "clang++-$CLANG_VER" --version
    # AppleClang version numbers do not track upstream LLVM, and the Xcode shipped on macos-latest is not new
    #  enough for the C++23 features Mata uses, so macOS always builds against Homebrew's own "llvm" formula and
    #  ignores the `compiler` input. Its bundled libc++ does not implement <generator> at all yet (libc++ hasn't
    #  shipped P2502 in any release) -- code needing it must guard on __cpp_lib_generator (see
    #  mata/utils/generator-support.hh) rather than assume C++23 support implies it.
    - name: Select Clang (macOS)
      if: ${{ inputs.os == 'macos-latest' }}
      shell: sh
      run: |
        brew install llvm
        LLVM_PREFIX="$(brew --prefix llvm)"
        echo "CC=$LLVM_PREFIX/bin/clang" >> "$GITHUB_ENV"
        echo "CXX=$LLVM_PREFIX/bin/clang++" >> "$GITHUB_ENV"
        echo "LDFLAGS=-L$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib -Wl,-rpath,$LLVM_PREFIX/lib/c++" >> "$GITHUB_ENV"
        echo "CPPFLAGS=-I$LLVM_PREFIX/include" >> "$GITHUB_ENV"
        "$LLVM_PREFIX/bin/clang++" --version
