name: Python binding (deploy to PyPI)
description: Build and upload the Python binding tarball to PyPI.
inputs:
  os:
    description: "Operating system to run the workflow on."
    required: false
    default: "ubuntu-latest"
  python-version:
    description: "Python version to use."
    required: false
    default: "3.13"
  version:
    description: "Version tag to write to the VERSION file (e.g. v1.2.3)."
    required: true
  pypi-token:
    description: "PyPI API token for uploading."
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up environment
      uses: ./.github/workflows/actions/setup
      with:
        os: ${{ inputs.os }}
    - name: Set up Python and its dependencies ${{ inputs.python-version }}
      uses: ./.github/workflows/actions/setup-python
      with:
        os: ${{ inputs.os }}
        python-version: ${{ inputs.python-version }}
        version: ${{ inputs.version }}
    - name: Compile the Python bindings from the source
      uses: ./.github/workflows/actions/compile-python-src
    - name: Compile the Python bindings from the tarball
      uses: ./.github/workflows/actions/compile-python-tarball
    - name: Build wheels
      shell: bash
      # Wheels spare users the C++ build (and a system cmake/make) on install. Only the manylinux
      #  and macOS targets that the library is tested on are built.
      env:
        CIBW_BUILD: "cp313-* cp314-*"
        CIBW_ARCHS_LINUX: "x86_64 aarch64"
        CIBW_ARCHS_MACOS: "x86_64 arm64"
        CIBW_BEFORE_ALL_LINUX: "yum install -y cmake make gcc-c++ || apt-get update && apt-get install -y cmake make g++"
        CIBW_TEST_EXTRAS: "dev"
        CIBW_TEST_COMMAND: "python -c \"import libmata.nfa.nfa as nfa; nfa.Nfa(1)\""
      run: |
        python3 -m pip install --upgrade cibuildwheel
        python3 -m cibuildwheel --output-dir bindings/python/dist bindings/python
    - name: Upload to PyPI
      shell: bash
      # The sdist and every built wheel are published together.
      run: python3 -m twine upload bindings/python/dist/*.tar.gz bindings/python/dist/*.whl
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ inputs.pypi-token }}
        # TWINE_REPOSITORY: testpypi
