name: Python binding (deploy to PyPI)
description: Upload the already built Python binding sdist and wheels to PyPI.
inputs:
  dist-dir:
    description: "Directory holding the sdist and every wheel to publish."
    required: true
  python-version:
    description: "Python version to run twine with."
    required: false
    default: "3.13"
  pypi-token:
    description: "PyPI API token for uploading."
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install twine
      shell: bash
      run: python3 -m pip install --upgrade twine
    # --skip-existing lets a rerun of a partially failed upload publish the remaining files instead of stopping at
    #  the first one PyPI already holds.
    - name: Upload to PyPI
      shell: bash
      run: python3 -m twine upload --skip-existing "$DIST_DIR"/*.tar.gz "$DIST_DIR"/*.whl
      env:
        DIST_DIR: ${{ inputs.dist-dir }}
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ inputs.pypi-token }}
        # TWINE_REPOSITORY: testpypi
