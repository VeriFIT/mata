name: Build Documentation
description: Build the documentation for Mata.
inputs:
  os:
    description: "Operating system to run on"
    required: false
    default: ubuntu-latest
  python-version:
    description: "Python version to use"
    required: false
    default: "3.13"
runs:
  using: "composite"
  steps:
    # It needs the same C++23-capable compiler as the other C++ jobs.
    - uses: ./.github/workflows/actions/setup
      with:
        os: ${{ inputs.os }}
    - name: Install Doxygen
      uses: ssciwr/doxygen-install@v1
    - name: Setup Python environment (docs-only dependencies, no binding)
      uses: ./.github/workflows/actions/setup-python
      with:
        os: ${{ inputs.os }}
        python-version: ${{ inputs.python-version }}
        install-binding: "false"
    - name: Configure for documentation
      shell: bash
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTING=OFF \
          -DMATA_BUILD_EXAMPLES=OFF
    - name: Generate Doxygen documentation
      shell: bash
      run: cmake --build build --target docs
    - name: Generate Sphinx documentation
      shell: bash
      run: make -C docs html
