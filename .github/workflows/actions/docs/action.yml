name: Build Documentation
description: Build the documentation for Mata.
inputs:
  os:
    description: "Operating system to run on"
    required: false
    default: ubuntu-latest
runs:
  using: "composite"
  steps:
    # Configuring needs the same C++23-capable compiler as the other C++ jobs.
    - uses: ./.github/workflows/actions/setup
      with:
        os: ${{ inputs.os }}
    # Before configuring: CMake defines the `docs` target only when it finds Doxygen.
    - uses: ssciwr/doxygen-install@v1
    # Doxygen reads only the sources: build the `docs` target alone and leave the tests and examples unconfigured.
    - name: Compile the documentation
      shell: bash
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF -DMATA_BUILD_EXAMPLES=OFF
        cmake --build build --target docs
