name: Setup Python environment
description: Setup Python environment for running workflows.
inputs:
  os:
    description: "Operating system to run on"
    required: false
    default: ubuntu-latest
  python-version:
    description: "Python version to run"
    required: true
  version:
    description: "Version tag to write to the VERSION file (e.g. v1.2.3)."
    required: false
    default: "v0.0.0-dev.1"
  install-binding:
    description: >-
      Whether to install the binding itself ("true") or only its dependencies ("false"), for jobs that build the binding later anyway.
    required: false
    default: "true"
  init:
    description: "Which Python dependencies to install: full also builds the binding and installs the test packages, build only the tools for creating an sdist."
    required: false
    default: "full"
runs:
  using: "composite"
  steps:
    - name: Add some version to VERSION file (since it cannot be inferred from git)
      shell: bash
      run: |
        echo "${{ inputs.version }}" > VERSION
        echo "${{ inputs.version }}" > bindings/python/VERSION
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        # cache: "pip"
    - name: Install the binding and its dependencies
      if: ${{ inputs.install-binding == 'true' }}
      shell: bash
      run: |
        python3 -m pip install --upgrade pip
        if [ "${{ inputs.init }}" = full ]; then
          make -C bindings/python init
        else
          # An sdist build needs no compiled binding: only the backend tools.
          python3 -m pip install "Cython>=3.0,<4" setuptools wheel
        fi
    # Building the binding compiles Mata, so a job that builds the binding later itself takes only the build and test
    #  tools (the shared dev group): the runtime dependency list is empty.
    - name: Install the build and test tools of the binding
      if: ${{ inputs.install-binding != 'true' }}
      shell: bash
      run: |
        python3 -m pip install --upgrade "pip>=25.1"
        python3 -m pip install --group bindings/python/pyproject.toml:dev
    - name: Building MacOS dependencies
      if: ${{ inputs.os == 'macos-latest' }}
      shell: bash
      run: brew install graphviz
    - name: Building Unix dependencies
      if: ${{ inputs.os == 'ubuntu-latest' }}
      shell: bash
      run: |
        sudo apt -qq update
        sudo apt -qq install -y graphviz graphviz-dev
    - name: Install Python Dependencies
      shell: bash
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install setuptools wheel twine
