  # Fails only on warnings this pull request introduces. Warnings the repository already has stay
  #  the maintainers' business, and `-Werror` is never turned on here: it lives behind the
  #  `*-werror` make targets for local use.
  compare-versions:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
    needs: [warnings-base, warnings-new]
    steps:
      - name: Restore new cache
        uses: actions/cache/restore@v5
        with:
          path: ./build_log
          key: build-log-warnings-new-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
      - run: mv build_log new_build_log
      - name: Restore base cache
        uses: actions/cache/restore@v5
        with:
          path: ./build_log
          key: build-log-warnings-base-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
      - run: mv build_log base_build_log
      # A plain `diff` of the two logs reports every warning whose line number moved, and misses a
      #  new warning that happens to land on the line an old one left. Compare sets of
      #  `<file>: warning: <message>` instead: line and column numbers are dropped, the checkout
      #  path is stripped so the two runners' absolute paths cannot differ, warnings from the
      #  vendored `3rdparty/` sources are not this repository's to fix, and parallel builds may
      #  order the logs differently, so both sides are sorted.
      - name: Collect the warnings of both versions
        run: |
          collect() {
            grep -E 'warning:' "$1" \
              | sed -E 's/:[0-9]+:[0-9]+:/:/' \
              | sed -E "s#^$PWD/##; s#^.*/mata/mata/##" \
              | grep -v '^3rdparty/' \
              | sort -u
          }
          collect base_build_log > base_warnings
          collect new_build_log > new_warnings
          echo "::group::Warnings on the base branch ($(wc -l < base_warnings))"
          cat base_warnings
          echo "::endgroup::"
          echo "::group::Warnings on this branch ($(wc -l < new_warnings))"
          cat new_warnings
          echo "::endgroup::"
      - name: Report warnings introduced by this pull request
        run: |
          comm -13 base_warnings new_warnings > introduced_warnings
          number_of_warnings=$(wc -l < introduced_warnings)
          if [ "$number_of_warnings" -gt 0 ]; then
            echo "This pull request introduces $number_of_warnings new warning(s):"
            cat introduced_warnings
            exit 1
          fi
          echo "This pull request introduces no new warnings."
  format-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: actions/checkout@v6
        with:
          # fetch-depth: 0
          # If PR, checkout the PR's repo (needed for PRs coming from forks).
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/workflows/actions/setup
      - name: Check .treefmt.toml is in sync with nix/treefmt.nix
        run: |
          nix run .#write-treefmt-toml
          if [ -n "$(git status --porcelain -- .treefmt.toml)" ]; then
              echo "ERROR: .treefmt.toml is out of date with nix/treefmt.nix. Run 'nix run .#write-treefmt-toml' locally and commit the changes:"
              git diff -- .treefmt.toml
              exit 1
          else
              echo ".treefmt.toml is in sync with nix/treefmt.nix."
          fi
      - name: Check formatting using treefmt through Nix
        run: |
          nix fmt
          if [ -n "$(git status --porcelain)" ]; then
              echo "ERROR: Code is not properly formatted. Please run 'nix fmt' or 'treefmt' locally and commit the changes:"
              git diff
              exit 1
          else
              echo "Code is properly formatted."
          fi
  build-docs:
    runs-on: ${{ matrix.os }}
    strategy:
