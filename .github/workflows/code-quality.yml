name: Code Quality
on:
  pull_request:
jobs:
  warnings-base:
    runs-on: ${{ matrix.os }}
    strategy:
      # Ensures that if the task on one system fails, other systems (the rest of the matrix) will be
      #  still executed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v6
        with:
          # fetch-depth: 0
          # If PR, checkout the PR's repo (needed for PRs coming from forks).
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.event.pull_request.base.ref || github.sha }}
      - uses: ./.github/workflows/actions/setup
        with:
          os: ${{ matrix.os }}
          compiler: ${{ matrix.compiler }}
      - uses: ./.github/workflows/actions/compile
      - name: Cache file with warnings
        uses: actions/cache@v5
        with:
          path: ./build_log
          key: build-log-warnings-base-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
  warnings-new:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v6
        with:
          # fetch-depth: 0
          # If PR, checkout the PR's repo (needed for PRs coming from forks).
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/workflows/actions/setup
        with:
          os: ${{ matrix.os }}
          compiler: ${{ matrix.compiler }}
      - uses: ./.github/workflows/actions/compile
      - name: Cache file with warnings
        uses: actions/cache@v5
        with:
          path: ./build_log
          key: build-log-warnings-new-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
  run-tests-cpp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v6
        with:
          # fetch-depth: 0
          # If PR, checkout the PR's repo (needed for PRs coming from forks).
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/workflows/actions/setup
        with:
          os: ${{ matrix.os }}
          compiler: ${{ matrix.compiler }}
      - uses: ./.github/workflows/actions/compile
      - name: Test the library
        run: make test
  run-tests-python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13"]
        install-type: ["src", "tarball"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/workflows/actions/setup
        with:
          os: ${{ matrix.os }}
      - name: Set up Python and its dependencies ${{ inputs.python-version }}
        uses: ./.github/workflows/actions/setup-python
        with:
          os: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}
      - name: Write the released version to VERSION file
        shell: bash
        run: |
          echo "v0.0.0-dev.1" > VERSION
          echo "v0.0.0-dev.1" > bindings/python/VERSION
      - name: Compile the Python bindings from the source
        uses: ./.github/workflows/actions/compile-python-src
      - name: Compile the Python bindings from the tarball
        if: matrix.install-type == 'tarball'
        uses: ./.github/workflows/actions/compile-python-tarball
      - name: Test the Python bindings
        uses: ./.github/workflows/actions/test-python
