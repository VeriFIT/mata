name: Code Quality
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  run-tests-cpp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        exclude:
          # AppleClang is not new enough for Mata's C++23 features, so macOS always builds with
          #  Homebrew's LLVM Clang. The gcc leg would compile the same thing, so exclude it.
          - os: macos-latest
            compiler: gcc
        include:
          # Exactly one leg builds everything; the others build only the tests target.
          - os: ubuntu-latest
            compiler: gcc
            build-target: all
    steps:
      - uses: actions/checkout@v6
        with:
          # fetch-depth: 0
          # If PR, checkout the PR's repo (needed for PRs coming from forks).
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/workflows/actions/setup
        with:
          os: ${{ matrix.os }}
          compiler: ${{ matrix.compiler }}
      - uses: ./.github/workflows/actions/install-solvers
        with:
          os: ${{ matrix.os }}
      # CMake uses ccache as the compiler launcher whenever it finds one (see `MATA_USE_CCACHE`),
      #  so installing it is all that is needed. One cache per leg: objects compiled by a different
      #  compiler or on a different OS would never hit anyway.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: run-tests-cpp-${{ matrix.os }}-${{ matrix.compiler }}
          max-size: 500M
      - uses: ./.github/workflows/actions/compile
        with:
          target: ${{ matrix.build-target || 'tests' }}
          werror: "true"
      - name: Test the library
        run: make test
  run-tests-python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13"]
        install-type: ["src", "tarball"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/workflows/actions/setup
        with:
          os: ${{ matrix.os }}
      - uses: ./.github/workflows/actions/install-solvers
        with:
          os: ${{ matrix.os }}
      - name: Set up Python and its dependencies ${{ inputs.python-version }}
        uses: ./.github/workflows/actions/setup-python
        with:
          os: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}
          install-binding: ${{ matrix.install-type == 'src' }}
      - name: Write the released version to VERSION file
        shell: bash
        run: |
          echo "v0.0.0-dev.1" > VERSION
          echo "v0.0.0-dev.1" > bindings/python/VERSION
      - name: Compile the Python bindings from the source
        if: matrix.install-type == 'src'
        uses: ./.github/workflows/actions/compile-python-src
      - name: Compile the Python bindings from the tarball
        if: matrix.install-type == 'tarball'
        uses: ./.github/workflows/actions/compile-python-tarball
      - name: Test the Python bindings
        uses: ./.github/workflows/actions/test-python
