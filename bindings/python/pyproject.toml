[project]
name = "libmata"
dynamic = ["version"]
description = "Python bindings for Mata: A fast and simple automata library"
readme = "README.md"
requires-python = ">=3.13"
keywords = ["automata", "finite automata", "alternating automata"]
authors = [
  { name = "Lukáš Holík", email = "holik@fit.vutbr.cz" },
  { name = "Ondřej Lengál", email = "lengal@fit.vutbr.cz" },
  { name = "Martin Hruška", email = "ihruskam@fit.vutbr.cz" },
  { name = "Tomáš Fiedor", email = "ifiedortom@fit.vutbr.cz" },
  { name = "David Chocholatý", email = "chocholaty.david@protonmail.com" },
  { name = "Juraj Síč", email = "sicjuraj@fit.vutbr.cz" },
  { name = "Tomáš Vojnar", email = "vojnar@fit.vutbr.cz" },
]
# The bindings themselves need nothing at runtime: pandas, networkx, tabulate, graphviz and IPython
#  are imported inside the functions that use them and are offered as extras.
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3.5", "tabulate>=0.8.10"]
plotting = ["graphviz>=0.20.1", "ipython>=7.9.0", "networkx>=2.6.3"]
notebooks = ["ipykernel>=7.1.0", "papermill>=2.6.0", "seaborn>=0.13.2"]
dev = ["pytest>=3.6.4", "pytest-cov>=3.0.0", "coverage>=6.4.1"]
all = [
  "coverage>=6.4.1",
  "graphviz>=0.20.1",
  "ipykernel>=7.1.0",
  "ipython>=7.9.0",
  "networkx>=2.6.3",
  "pandas>=1.3.5",
  "papermill>=2.6.0",
  "pytest>=3.6.4",
  "pytest-cov>=3.0.0",
  "seaborn>=0.13.2",
  "tabulate>=0.8.10",
]

[project.urls]
Homepage = "https://github.com/VeriFIT/mata"

[tool.setuptools]
packages = ["libmata", "libmata.nfa", "libmata.nft"]

[build-system]
# The sources are Cython 3 only (cimports of libcpp.optional, noexcept semantics), and Cython 4 has
#  not been validated against them yet.
requires = ["setuptools", "wheel", "Cython>=3.0,<4", "cmake>=3.23"]
build-backend = "setuptools.build_meta"
