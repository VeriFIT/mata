[package]
name = "mata-logic"
version = "0.1.0"
description = "Decision procedures for logics over automatic structures, on top of mata-lazy"
readme = "README.md"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords = ["automata", "logic", "presburger", "ws1s", "decision-procedure"]
categories = ["algorithms", "mathematics"]
# Not on crates.io yet: the API is still settling. `mata` re-exports it as `mata::logic`.
publish = false

[dependencies]
mata-lazy.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true

[dev-dependencies]
rand.workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
