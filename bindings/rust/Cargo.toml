[workspace]
members = ["mata-sys", "mata", "mata-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
# The floor set by cxx 1.0.205.
rust-version = "1.88"
authors = ["Nguyen Le Duy <nguyenleduy12610@gmail.com>"]
license = "MIT"
repository = "https://github.com/VeriFIT/mata"
keywords = ["automata", "nfa", "transducer", "regex", "verification"]
categories = ["api-bindings", "algorithms", "mathematics"]

[workspace.dependencies]
mata-sys = { version = "0.1.0", path = "mata-sys" }
cxx = "1.0.205"
cxx-build = { version = "1.0.205", features = ["parallel"] }
cmake = "0.1.58"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
proptest = "1.12.0"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
