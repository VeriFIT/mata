[workspace]
members = ["mata-sys", "mata", "lazymat"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
authors = ["Nguyen Le Duy <nguyenleduy12610@gmail.com>"]
license = "MIT"
repository = "https://github.com/VeriFIT/mata"
keywords = ["automata", "nfa", "transducer", "regex", "verification"]
categories = ["api-bindings", "algorithms", "mathematics"]

[workspace.dependencies]
mata-sys = { version = "0.1.0", path = "mata-sys" }
mata = { version = "0.1.0", path = "mata" }
cxx = "1.0.205"
cxx-build = { version = "1.0.205", features = ["parallel"] }
cmake = "0.1.58"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
proptest = "1.12.0"
hashbrown = { version = "0.17.1", default-features = false }
indexmap = "2.14.2"
parking_lot = "0.13.0"
rustc-hash = "2.1.3"
stacker = "0.1.25"
regex-automata = { version = "0.4.18", features = ["dfa-build", "syntax"] }
rustfst = "1.3.1"
rand = "0.10.3"
typed-index-collections = "3.5.0"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
