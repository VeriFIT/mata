# Codacy's JavaScript, CSS and HTML rules (JSDoc on every function, no hex colours, ...) do not fit the website, whose
#  style is checked by prettier in the format check instead.
exclude_paths:
  - "site/**"
  - "bindings/wasm/smoke-test.mjs"
  # Vendored from https://github.com/jothepro/doxygen-awesome-css; only reformatted, never restyled, by the tools.
  - "docs/doxygen-awesome.css"
