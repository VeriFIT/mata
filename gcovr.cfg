filter = src/
filter = include/
# The report format and its destination belong to the caller: `make test-coverage` passes
#  `--html-details --output $(BUILD_DIR)/coverage.html`. Pinning `output` here made gcovr fail at
#  config-parse time for any build directory other than `build/`, even when the caller overrode it.
sort = uncovered-percent
exclude-unreachable-branches = yes
exclude-throw-branches = yes
